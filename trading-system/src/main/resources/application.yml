server:
  port: 8080

spring:
  application:
    name: trading-system
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Bloomberg EMSX 配置
bloomberg:
  emsx:
    host: localhost
    port: 8194
    service-name: //blp/emx_api
    application-name: trading-system

# 管理后台配置
admin:
  default-page-size: 20
  max-page-size: 100

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.trading: DEBUG
    org.springframework: INFO